<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ede5">
  <meta name="format-detection" content="telephone=no">
  <title>NeuroLens</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NeuroLens">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="A private system for emotional balance, clear thinking and reading people, in 41-day cycles. Your data stays on your device.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">NeuroLens</div>
      <div class="sub" id="dayLabel"></div>
    </div>
    <div class="streak" id="streakBadge" title="Current streak"></div>
  </header>

  <div class="banner" id="activeBanner" hidden></div>

  <main id="view"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="today" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg>Home</button>
    <button data-tab="capture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/></svg>Capture</button>
    <button data-tab="sadhana"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20c-4 0-8-2.5-9-6 3 0 6 1 9 4 3-3 6-4 9-4-1 3.5-5 6-9 6z"/><path d="M12 18c-2-2.5-3-5-3-8 0-2 1.2-4 3-6 1.8 2 3 4 3 6 0 3-1 5.5-3 8z"/></svg>Sadhana</button>
    <button data-tab="night"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5 7.5 7.5 0 1 0 19 14.5z"/></svg>Night</button>
    <button data-tab="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/></svg>Library</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Progress</button>
  </nav>

  <script src="content.js"></script>
  <script src="app.js"></script>
  <script src="sadhana.js"></script>
</body>
</html>
