<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5d56">
  <title>NeuroLens</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NeuroLens">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="A private system for emotional balance, clear thinking and reading people, in 41-day cycles. Your data stays on your device.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">NeuroLens</div>
      <div class="sub" id="dayLabel"></div>
    </div>
    <div class="streak" id="streakBadge" title="Current streak"></div>
  </header>

  <div class="banner" id="activeBanner" hidden></div>

  <main id="view"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="today" class="active"><span>☀</span>Today</button>
    <button data-tab="capture"><span>⚡</span>Capture</button>
    <button data-tab="night"><span>☾</span>Night</button>
    <button data-tab="library"><span>📖</span>Library</button>
    <button data-tab="progress"><span>▦</span>Progress</button>
  </nav>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
